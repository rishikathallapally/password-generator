
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate strong and secure passwords easily.">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="container">

        <section class="password-card">

            <header class="header">
                <div class="icon">🔐</div>
                <h1>Password Generator</h1>
                <p>Create strong and secure passwords instantly.</p>
            </header>

            <div class="password-output">
                <label for="password">Generated Password</label>

                <div class="password-field">
                    <input
                        type="text"
                        id="password"
                        placeholder="Your password will appear here"
                        readonly
                    >

                    <button type="button" id="copy-btn">Copy</button>
                </div>
            </div>

            <div class="settings">

                <div class="length-setting">
                    <label for="length">Password Length</label>
                    <input type="number" id="length" min="4" max="32" value="12">
                </div>

                <div class="character-options">
                    <h3>Character Options</h3>

                    <label>
                        <input type="checkbox" id="uppercase" checked>
                        Uppercase Letters (A-Z)
                    </label>

                    <label>
                        <input type="checkbox" id="lowercase" checked>
                        Lowercase Letters (a-z)
                    </label>

                    <label>
                        <input type="checkbox" id="numbers" checked>
                        Numbers (0-9)
                    </label>

                    <label>
                        <input type="checkbox" id="symbols">
                        Symbols (!@#$)
                    </label>
                </div>

            </div>

            <button type="button" id="generate-btn">
                Generate Password
            </button>

            <p id="message" aria-live="polite"></p>

        </section>

    </main>

</body>
</html>
